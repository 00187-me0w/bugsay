{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="wrap wrap--narrow page-head section" style="text-align:center">
    <p class="eyebrow">404</p>
    <h1 class="title-1">This page has drifted off.</h1>
    <p class="subhead" style="margin: 0.75rem auto 0">The page you were looking for doesn't exist.</p>
    <div class="button-row" style="justify-content:center">
        <a href="{{ url_for('home') }}" class="btn btn-secondary">Go home</a>
        <a href="{{ url_for('schedules') }}" class="btn btn-primary">Find a ferry</a>
    </div>
</div>
{% endblock %}
